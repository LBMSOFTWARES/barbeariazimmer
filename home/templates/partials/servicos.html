
    {% for servico in servicos %}
        <div class="servico-item">

            <div class="esquerda">
                <span class="titulo">
                    {{ servico.titulo }}
                    <span class="tempo">({{ servico.duracao_minutos }} min)</span>
                </span>

                <span class="preco">R$ {{ servico.preco }}</span>
            </div>

            <div class="direita">
                {% if user_logado %}
                <a 
                hx-get="{% url 'selecionar_servicos' %}"
                hx-target="#area-servicos"
                hx-swap="innerHTML"
                class="btn-agendar">
                Agendar
                </a>
                {% else %}
                <a href="{% url 'realizar_cadastro' %}" class="btn-agendar">Agendar</a>
                {% endif %}
            </div>
            
        </div>
        
    {% empty %}
        <p class="sem-servicos">Nenhum serviço cadastrado.</p>
    {% endfor %}
<div id="area-servicos">
    <!-- Aqui carrega o primeiro HTMX -->
</div>
