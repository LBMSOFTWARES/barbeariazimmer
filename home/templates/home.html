{% extends 'base.html' %}
    {% block content1 %}
    <div class="body_1">
        <div class="body_subtotal_home">
            <div class="sub_menu_servicos">
                
            </div>
        
            <form method="POST" action="{% url 'agendar_servico' %}">
    {% csrf_token %}

    <div class="servicos-container">

        {% for servico in servicos %}
            <div class="servico-item">

                {% if user_logado %}
                <label class="servico-label">
                    <input 
                        type="checkbox" 
                        name="servicos" 
                        value="{{ servico.id }}"
                        class="checkbox-servico"
                    >

                    <div class="conteudo-servico">
                        <div class="linha-superior">
                            <span class="titulo">
                                {{ servico.titulo }}
                                <span class="tempo">({{ servico.duracao_minutos }} min)</span>
                            </span>
                        </div>

                        <span class="preco">R$ {{ servico.preco }}</span>
                    </div>
                </label>
                {% else %}
                    <!-- mantém seu botão normal -->
                {% endif %}

            </div>

        {% empty %}
            <p class="sem-servicos">Nenhum serviço cadastrado.</p>
        {% endfor %}

    </div>

    {% if user_logado %}
        <div style="margin-top:20px;text-align:center;">
            <button type="submit" class="btn1">
                Continuar Agendamento
            </button>
        </div>
    {% endif %}

</form>
        
        </div>
    </div>
    {% endblock %}
</body>
</html>
